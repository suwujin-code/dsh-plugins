name: AGI KB RAW Ingest

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/agi-kb-raw-ingest.yml

permissions:
  contents: read

jobs:
  resplit-llamaindex:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download immutable LlamaIndex archive and split below transfer limit
        shell: bash
        run: |
          set -euo pipefail
          repo='run-llama/llama_index'
          commit='56beedf959cbf6356b0a8f5a4f468d066bb5b91f'
          filename='30_LlamaIndex_56beedf959cb.zip'
          expected='9ee8a8da13e00bc8d836e99e1b4211f281bec33fb6b8fa87858702f9697ca1bd'
          mkdir -p work/parts meta
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 2400 \
            --user-agent 'AGI-KB-Archiver/1.0' \
            "https://codeload.github.com/${repo}/zip/${commit}" --output "work/${filename}"
          [[ "$(head -c 2 "work/${filename}")" == 'PK' ]]
          unzip -tq "work/${filename}" >/dev/null
          actual="$(sha256sum "work/${filename}" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          split -b 80000000 -d -a 2 "work/${filename}" "work/parts/${filename}.part-"
          [[ "$(find work/parts -type f | wc -l)" -eq 4 ]]
          find work/parts -type f -print0 | sort -z | xargs -0 sha256sum > meta/PARTS_SHA256.txt
          printf '%s  %s\n' "$actual" "$filename" > meta/ORIGINAL_SHA256.txt
          cat > meta/README_REASSEMBLE.md <<EOF
          Original: ${filename}
          Repository: ${repo}
          Commit: ${commit}
          Reassemble: cat ${filename}.part-* > ${filename}
          Verify SHA256: ${expected}
          EOF
          printf '{"id":"30","module":"06","repository":"%s","commit_sha":"%s","filename":"%s","bytes":%s,"sha256":"%s","part_size":80000000,"part_count":4,"status":"RAW_DOWNLOADED"}\n' \
            "$repo" "$commit" "$filename" "$(stat -c%s "work/${filename}")" "$actual" > meta/manifest.json
      - name: Upload LlamaIndex part 00
        uses: actions/upload-artifact@v4
        with:
          name: agi-kb-resplit-30-part-00
          path: work/parts/30_LlamaIndex_56beedf959cb.zip.part-00
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload LlamaIndex part 01
        uses: actions/upload-artifact@v4
        with:
          name: agi-kb-resplit-30-part-01
          path: work/parts/30_LlamaIndex_56beedf959cb.zip.part-01
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload LlamaIndex part 02
        uses: actions/upload-artifact@v4
        with:
          name: agi-kb-resplit-30-part-02
          path: work/parts/30_LlamaIndex_56beedf959cb.zip.part-02
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload LlamaIndex part 03
        uses: actions/upload-artifact@v4
        with:
          name: agi-kb-resplit-30-part-03
          path: work/parts/30_LlamaIndex_56beedf959cb.zip.part-03
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload LlamaIndex metadata
        uses: actions/upload-artifact@v4
        with:
          name: agi-kb-resplit-30-meta
          path: meta/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  resplit-terminal-bench:
