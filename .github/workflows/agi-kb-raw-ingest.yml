name: AGI KB RAW Ingest

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/agi-kb-raw-ingest.yml

permissions:
  contents: read

jobs:
  ingest-p0-repository-batch-02:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve commits, download immutable repository ZIPs, and verify
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p raw logs
          cat > repositories.tsv <<'EOF'
          18	04	MCP_Spec	modelcontextprotocol/modelcontextprotocol
          19	04	MCP_Python_SDK	modelcontextprotocol/python-sdk
          19	04	MCP_TypeScript_SDK	modelcontextprotocol/typescript-sdk
          20	04	A2A_Protocol	a2aproject/A2A
          22	04	Agent_Skills	agentskills/agentskills
          23	05	OpenAI_Agents_SDK	openai/openai-agents-python
          24	05	Claude_Agent_SDK_Python	anthropics/claude-agent-sdk-python
          25	05	Google_ADK_Python	google/adk-python
          26	05	Microsoft_Agent_Framework	microsoft/agent-framework
          27	05	LangGraph	langchain-ai/langgraph
          28	05	PydanticAI	pydantic/pydantic-ai
          EOF

          printf 'id,module,component,repository,default_branch,commit_sha,filename,status,bytes,sha256,error\n' > logs/repository_manifest.csv
          : > logs/failures.log
          success=0
          failed=0

          while IFS=$'\t' read -r id module component repository; do
            echo "Resolving ${repository}"
            meta="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
                    --user-agent 'AGI-KB-Archiver/1.0' "https://api.github.com/repos/${repository}" 2>>logs/failures.log || true)"
            branch="$(printf '%s' "$meta" | jq -r '.default_branch // empty' 2>/dev/null || true)"
            if [[ -z "$branch" ]]; then
              printf '%s,%s,%s,%s,,,,FAILED_RESOLVE,0,,default_branch_missing\n' "$id" "$module" "$component" "$repository" >> logs/repository_manifest.csv
              failed=$((failed+1))
              continue
            fi

            commit_json="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
                    --user-agent 'AGI-KB-Archiver/1.0' "https://api.github.com/repos/${repository}/commits/${branch}" 2>>logs/failures.log || true)"
            commit_sha="$(printf '%s' "$commit_json" | jq -r '.sha // empty' 2>/dev/null || true)"
            if [[ -z "$commit_sha" ]]; then
              printf '%s,%s,%s,%s,%s,,,FAILED_RESOLVE,0,,commit_sha_missing\n' "$id" "$module" "$component" "$repository" "$branch" >> logs/repository_manifest.csv
              failed=$((failed+1))
              continue
            fi

            short="${commit_sha:0:12}"
            filename="${id}_${component}_${short}.zip"
            dest="raw/${module}/${filename}"
            tmp="${dest}.part"
            mkdir -p "$(dirname "$dest")"
            url="https://codeload.github.com/${repository}/zip/${commit_sha}"
            echo "Downloading ${repository}@${commit_sha}"
            if curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 \
                 --user-agent 'AGI-KB-Archiver/1.0' "$url" --output "$tmp"; then
              bytes="$(stat -c%s "$tmp")"
              magic="$(head -c 2 "$tmp" || true)"
              if [[ "$magic" == 'PK' && "$bytes" -gt 1000 ]] && unzip -tq "$tmp" >/dev/null 2>&1; then
                mv "$tmp" "$dest"
                digest="$(sha256sum "$dest" | awk '{print $1}')"
                printf '%s,%s,%s,%s,%s,%s,%s,RAW_DOWNLOADED,%s,%s,\n' \
                  "$id" "$module" "$component" "$repository" "$branch" "$commit_sha" "$filename" "$bytes" "$digest" >> logs/repository_manifest.csv
                success=$((success+1))
              else
                rm -f "$tmp"
                printf '%s,%s,%s,%s,%s,%s,%s,FAILED_VALIDATION,%s,,invalid_or_corrupt_zip\n' \
                  "$id" "$module" "$component" "$repository" "$branch" "$commit_sha" "$filename" "$bytes" >> logs/repository_manifest.csv
                failed=$((failed+1))
              fi
            else
              rc=$?
              rm -f "$tmp"
              printf '%s,%s,%s,%s,%s,%s,%s,FAILED_DOWNLOAD,0,,curl_exit_%s\n' \
                "$id" "$module" "$component" "$repository" "$branch" "$commit_sha" "$filename" "$rc" >> logs/repository_manifest.csv
              failed=$((failed+1))
            fi
          done < repositories.tsv

          find raw -type f -print0 | sort -z | xargs -0 -r sha256sum > logs/SHA256SUMS.txt
          printf '{"batch":"p0-repository-batch-02","successful_components":%s,"failed_components":%s,"generated_at":"%s"}\n' \
            "$success" "$failed" "$(date -u +%FT%TZ)" > logs/summary.json
          cat logs/summary.json

      - name: Upload immutable repository snapshots
        uses: actions/upload-artifact@v4
        with:
          name: agi-agent-p0-repository-batch-02
          path: |
            raw/
            logs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
