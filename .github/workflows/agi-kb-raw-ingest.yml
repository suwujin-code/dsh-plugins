name: AGI KB RAW Ingest

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/agi-kb-raw-ingest.yml

permissions:
  contents: read

jobs:
  ingest-p1-repositories:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: '48', module: '11', component: 'WebArena', repository: 'web-arena-x/webarena'}
          - {id: '49', module: '11', component: 'OSWorld_V2', repository: 'xlang-ai/OSWorld-V2'}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve immutable commit and verify archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload meta
          repo='${{ matrix.repository }}'
          branch="$(curl -fsSL --retry 5 --retry-all-errors --user-agent 'AGI-KB-Archiver/1.0' "https://api.github.com/repos/${repo}" | jq -r '.default_branch')"
          commit_sha="$(curl -fsSL --retry 5 --retry-all-errors --user-agent 'AGI-KB-Archiver/1.0' "https://api.github.com/repos/${repo}/commits/${branch}" | jq -r '.sha')"
          short="${commit_sha:0:12}"
          filename='${{ matrix.id }}_${{ matrix.component }}_'"${short}.zip"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 --user-agent 'AGI-KB-Archiver/1.0' \
            "https://codeload.github.com/${repo}/zip/${commit_sha}" --output "payload/${filename}"
          bytes="$(stat -c%s "payload/${filename}")"
          [[ "$(head -c 2 "payload/${filename}")" == 'PK' ]]
          [[ "$bytes" -gt 1000 ]]
          unzip -tq "payload/${filename}" >/dev/null
          digest="$(sha256sum "payload/${filename}" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$filename" > meta/SHA256SUMS.txt
          printf '{"id":"%s","module":"%s","component":"%s","repository":"%s","default_branch":"%s","commit_sha":"%s","filename":"%s","bytes":%s,"sha256":"%s","status":"RAW_DOWNLOADED"}\n' \
            '${{ matrix.id }}' '${{ matrix.module }}' '${{ matrix.component }}' "$repo" "$branch" "$commit_sha" "$filename" "$bytes" "$digest" > meta/manifest.json
      - name: Upload P1 repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: agi-kb-p1-${{ matrix.id }}-${{ matrix.component }}
          path: |
            payload/
            meta/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  archive-p1-bfcl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture BFCL leaderboard source
        shell: bash
        run: |
          set -uo pipefail
          id='51'; module='11'; slug='BFCL_V4_Leaderboard'; url='https://gorilla.cs.berkeley.edu/leaderboard.html'
          root="capture/${id}_${slug}"
          mkdir -p "$root/raw" "$root/rendered" "$root/meta" payload
          curl_meta="$(curl --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 \
            --user-agent 'Mozilla/5.0 AGI-KB-Archiver/1.0' --dump-header "$root/raw/response_headers.txt" \
            --output "$root/raw/raw_response.html" --write-out '%{http_code}\t%{url_effective}' "$url" 2>"$root/meta/curl_error.log" || true)"
          http_code="${curl_meta%%$'\t'*}"; final_url="${curl_meta#*$'\t'}"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -n "$browser" ]]; then
            timeout 180 "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom "$url" > "$root/rendered/rendered_dom.html" 2>"$root/meta/browser_dom_error.log" || true
            timeout 240 "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --print-to-pdf="$root/rendered/rendered_page.pdf" "$url" > "$root/meta/browser_pdf_stdout.log" 2>"$root/meta/browser_pdf_error.log" || true
          fi
          raw_bytes="$(stat -c%s "$root/raw/raw_response.html" 2>/dev/null || echo 0)"
          dom_bytes="$(stat -c%s "$root/rendered/rendered_dom.html" 2>/dev/null || echo 0)"
          pdf_bytes="$(stat -c%s "$root/rendered/rendered_page.pdf" 2>/dev/null || echo 0)"
          if [[ "$pdf_bytes" -gt 0 && "$(head -c 5 "$root/rendered/rendered_page.pdf" || true)" != '%PDF-' ]]; then rm -f "$root/rendered/rendered_page.pdf"; pdf_bytes=0; fi
          if [[ "$http_code" == '200' && ( "$raw_bytes" -gt 500 || "$dom_bytes" -gt 1000 || "$pdf_bytes" -gt 10000 ) ]]; then status='RAW_DOWNLOADED'; else status='FAILED_CAPTURE'; fi
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > "$root/meta/SHA256SUMS.txt"
          bundle="payload/${id}_${slug}_OFFICIAL_WEB_SNAPSHOT.zip"
          zip -qr "$bundle" "$root"; unzip -tq "$bundle" >/dev/null
          bytes="$(stat -c%s "$bundle")"; digest="$(sha256sum "$bundle" | awk '{print $1}')"
          printf 'id,module,slug,url,status,http_code,final_url,raw_bytes,rendered_dom_bytes,rendered_pdf_bytes,bundle_bytes,bundle_sha256\n' > payload/capture_manifest.csv
          printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s\n' "$id" "$module" "$slug" "$url" "$status" "$http_code" "$final_url" "$raw_bytes" "$dom_bytes" "$pdf_bytes" "$bytes" "$digest" >> payload/capture_manifest.csv
          printf '%s  %s\n' "$digest" "$(basename "$bundle")" > payload/BUNDLE_SHA256.txt
          cat payload/capture_manifest.csv
      - name: Upload BFCL official web snapshot
        uses: actions/upload-artifact@v4
        with:
          name: agi-kb-p1-51-BFCL_V4_Leaderboard
          path: payload/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
