name: AGI KB RAW Ingest

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/agi-kb-raw-ingest.yml

permissions:
  contents: read

jobs:
  ingest-openai-official-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify official OpenAI PDFs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p raw/02 raw/09 logs
          cat > sources.tsv <<'EOF'
          9	02	09_OpenAI_A_Practical_Guide_to_Building_Agents.pdf	https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf
          44	09	44_OpenAI_Preparedness_Framework_v2.pdf	https://cdn.openai.com/pdf/18a02b5d-6b67-4cec-ab64-68cdfbddebcd/preparedness-framework-v2.pdf
          EOF
          printf 'id,module,filename,url,status,bytes,sha256,error\n' > logs/download_manifest.csv
          success=0; failed=0
          while IFS=$'\t' read -r id module filename url; do
            dest="raw/${module}/${filename}"; tmp="${dest}.part"
            if curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 \
                 --user-agent 'Mozilla/5.0 AGI-KB-Archiver/1.0' "$url" --output "$tmp"; then
              bytes="$(stat -c%s "$tmp")"
              if [[ "$(head -c 5 "$tmp" || true)" == '%PDF-' && "$bytes" -gt 10000 ]]; then
                mv "$tmp" "$dest"; digest="$(sha256sum "$dest" | awk '{print $1}')"
                printf '%s,%s,%s,%s,RAW_DOWNLOADED,%s,%s,\n' "$id" "$module" "$filename" "$url" "$bytes" "$digest" >> logs/download_manifest.csv
                success=$((success+1))
              else
                rm -f "$tmp"; printf '%s,%s,%s,%s,FAILED_VALIDATION,%s,,not_pdf_or_too_small\n' "$id" "$module" "$filename" "$url" "$bytes" >> logs/download_manifest.csv; failed=$((failed+1))
              fi
            else
              rc=$?; rm -f "$tmp"; printf '%s,%s,%s,%s,FAILED_DOWNLOAD,0,,curl_exit_%s\n' "$id" "$module" "$filename" "$url" "$rc" >> logs/download_manifest.csv; failed=$((failed+1))
            fi
          done < sources.tsv
          find raw -type f -print0 | sort -z | xargs -0 -r sha256sum > logs/SHA256SUMS.txt
          printf '{"batch":"openai-official-pdf-repair","success":%s,"failed":%s,"generated_at":"%s"}\n' "$success" "$failed" "$(date -u +%FT%TZ)" > logs/summary.json
          cat logs/download_manifest.csv

      - name: Upload verified OpenAI PDFs
        uses: actions/upload-artifact@v4
        with:
          name: agi-agent-openai-official-pdf-repair
          path: |
            raw/
            logs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
