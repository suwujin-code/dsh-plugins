          mkdir -p work/parts meta
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 2400 \
            --user-agent 'AGI-KB-Archiver/1.0' \
            "https://codeload.github.com/${repo}/zip/${commit}" --output "work/${filename}"
          [[ "$(head -c 2 "work/${filename}")" == 'PK' ]]
          unzip -tq "work/${filename}" >/dev/null
          actual="$(sha256sum "work/${filename}" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          split -b 80000000 -d -a 2 "work/${filename}" "work/parts/${filename}.part-"
          [[ "$(find work/parts -type f | wc -l)" -eq 7 ]]
          find work/parts -type f -print0 | sort -z | xargs -0 sha256sum > meta/PARTS_SHA256.txt
